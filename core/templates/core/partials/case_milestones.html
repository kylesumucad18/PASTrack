<div class="premium-div2 premium-card">
    <h3 class="premium-section-title"><i class="ri-route-line"></i> Case Milestones</h3>
    <div class="premium-timeline">
        {% for ms in case_milestones %}
        <div class="premium-log-item">
            <div class="premium-log-dot {{ ms.dot_class }}"></div>
            <div class="premium-log-time">{{ ms.time }}</div>
            <div class="premium-log-action">{{ ms.label|linebreaksbr }}</div>
            <div class="premium-log-staff">
                <div class="premium-staff-avatar">{{ ms.avatar }}</div>
                {{ ms.actor_display }}
            </div>
        </div>
        {% empty %}
        <div class="premium-log-item">
            <div class="premium-log-time">No milestones recorded yet.</div>
        </div>
        {% endfor %}

    </div>
</div>
